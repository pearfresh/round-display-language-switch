<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Round Display Helper</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c1018; color: #f7f8fb; }
    main { width: min(560px, calc(100% - 40px)); text-align: center; }
    .mark { width: 84px; height: 84px; margin: 0 auto 24px; border-radius: 50%; background: linear-gradient(#fff 0 33%, #1857d8 33% 66%, #e13034 66%); box-shadow: 0 22px 55px #0008; }
    h1 { font-size: clamp(32px, 7vw, 54px); letter-spacing: -0.04em; margin: 0 0 12px; }
    p { color: #b9c0cf; line-height: 1.55; }
    a { display: inline-block; margin-top: 20px; padding: 14px 22px; border-radius: 14px; background: #fff; color: #111; text-decoration: none; font-weight: 700; }
    small { display: block; margin-top: 24px; color: #778092; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Round Display Helper</h1>
    <p>Keep the flag on your round display synchronized with the current macOS keyboard input language.</p>
    <a id="download" href="#">Download for macOS</a>
    <small>Apple Silicon and Intel · macOS 12 or newer</small>
  </main>
  <script>
    const owner = location.hostname.split('.')[0];
    const repo = location.pathname.split('/').filter(Boolean)[0];
    const link = document.querySelector('#download');
    if (owner && repo) {
      link.href = `https://github.com/${owner}/${repo}/releases/latest/download/RoundDisplayHelper-macOS.zip`;
    } else {
      link.textContent = 'Open GitHub Releases';
      link.href = '../releases/latest';
    }
  </script>
</body>
</html>

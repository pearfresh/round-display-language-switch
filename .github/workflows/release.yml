name: Release Round Display Helper

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS helper
        run: tools/build_macos_release.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/RoundDisplayHelper-macOS.zip
          --generate-notes
          --title "$GITHUB_REF_NAME"
